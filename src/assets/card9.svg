<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 750 1050" width="100%" height="100%">
    <defs>
        <linearGradient id="cyberBg" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#040914" />
            <stop offset="100%" stop-color="#0b1326" />
        </linearGradient>
        <linearGradient id="neonGlow" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#00f0ff" />
            <stop offset="100%" stop-color="#0066ff" />
        </linearGradient>
        <filter id="glow">
            <feGaussianBlur stdDeviation="5" result="blur" />
            <feComposite in="SourceGraphic" in2="blur" operator="over" />
        </filter>
        <clipPath id="artFrame">
            <polygon points="50,150 700,150 700,540 640,600 50,600" />
        </clipPath>
    </defs>

    <!-- BACKGROUND -->
    <rect width="750" height="1050" fill="url(#cyberBg)" />
    <rect width="730" height="1030" x="10" y="10" fill="none" stroke="#00f0ff" stroke-width="1" stroke-opacity="0.2" />

    <!-- ARTWORK WINDOW -->
    <g clip-path="url(#artFrame)">
        <rect x="50" y="150" width="650" height="450" fill="#071124" />
        <circle cx="375" cy="350" r="120" fill="none" stroke="#00f0ff" stroke-width="1" stroke-opacity="0.2" stroke-dasharray="10,5" />
        <text x="375" y="360" fill="#00f0ff" font-family="sans-serif" font-size="20" font-weight="bold" letter-spacing="4" text-anchor="middle" opacity="0.4">UNIT ILLUSTRATION AREA</text>
    </g>
    <polygon points="50,150 700,150 700,540 640,600 50,600" fill="none" stroke="url(#neonGlow)" stroke-width="3" filter="url(#glow)" />

    <!-- HEADER BAR (Title & Cost) -->
    <polygon points="40,60 560,60 590,130 40,130" fill="#0c1930" stroke="#00f0ff" stroke-width="1.5" />
    <text x="70" y="105" fill="#ffffff" font-family="sans-serif" font-size="32" font-weight="900" letter-spacing="2">NETRUNNER LYNX</text>

    <!-- COST MODULE (Top Right Hex) -->
    <g transform="translate(620, 45)">
        <polygon points="40,0 80,23 80,68 40,91 0,68 0,23" fill="#040914" stroke="#ff0055" stroke-width="3" filter="url(#glow)" />
        <text x="40" y="58" fill="#ffffff" font-family="sans-serif" font-size="36" font-weight="bold" text-anchor="middle">5</text>
    </g>

    <!-- TYPE SUB-BAR -->
    <polygon points="50,580 340,580 360,615 50,615" fill="#0c1930" stroke="#00f0ff" stroke-width="1.5" />
    <text x="70" y="604" fill="#00f0ff" font-family="sans-serif" font-size="15" font-weight="bold" letter-spacing="3">AGENT // CYBORG</text>

    <!-- TEXT BOX -->
    <rect x="50" y="640" width="650" height="250" rx="10" fill="#060d1a" stroke="#00f0ff" stroke-width="1.5" stroke-opacity="0.7" />
    <line x1="50" y1="640" x2="700" y2="640" stroke="#00f0ff" stroke-width="3" />

    <text x="80" y="690" fill="#ffffff" font-family="sans-serif" font-size="19" font-weight="bold">
        <tspan fill="#ff0055">Infiltrate:</tspan> Bypass opponent Frontline Node walls.
    </text>
    <text x="80" y="735" fill="#c4d9fd" font-family="sans-serif" font-size="18">
        When this unit deals damage directly to the opponent's
    </text>
    <text x="80" y="765" fill="#c4d9fd" font-family="sans-serif" font-size="18">
        Core System, draw 2 memory bank option frames.
    </text>

    <!-- STAT BADGES WITH EMBEDDED PATH ICONS -->
    <!-- LEFT EMBEDDED ATK ICON (Crossed Blades) -->
    <g transform="translate(50, 915)">
        <rect width="180" height="60" rx="8" fill="#14060b" stroke="#ff0055" stroke-width="2" />
        <!-- ATK SVG Icon Path -->
        <g transform="translate(15, 12) scale(1.1)" stroke="#ff0055" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
            <path d="M5,30 L30,5 M30,5 L22,3 M30,5 L32,13 M20,15 L25,20" />
            <path d="M30,30 L5,5 M5,5 L13,3 M5,5 L3,13 M15,15 L10,20" />
        </g>
        <text x="160" y="42" fill="#ffffff" font-family="sans-serif" font-size="32" font-weight="900" text-anchor="end">400</text>
    </g>

    <!-- RIGHT EMBEDDED DEF ICON (Cyber Shield) -->
    <g transform="translate(520, 915)">
        <rect width="180" height="60" rx="8" fill="#03141c" stroke="#00f0ff" stroke-width="2" />
        <!-- DEF SVG Icon Path -->
        <g transform="translate(20, 15) scale(1.2)" stroke="#00f0ff" stroke-width="2.5" fill="none" stroke-linecap="round">
            <path d="M12,2 C12,2 22,5 22,11 C22,18 12,22 12,22 C12,22 2,18 2,11 C2,5 12,2 12,2 Z" />
            <path d="M12,6 L12,18 M8,11 L16,11" stroke-dasharray="2,2" />
        </g>
        <text x="160" y="42" fill="#ffffff" font-family="sans-serif" font-size="32" font-weight="900" text-anchor="end">350</text>
    </g>

    <!-- FOOTER -->
    <text x="50" y="1010" fill="#36496a" font-family="monospace" font-size="12">CY-77 // ULTRA RARE</text>
</svg>
