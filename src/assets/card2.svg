<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 750 1050" width="100%" height="100%">
    <defs>
        <!-- Background Gradient -->
        <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#060b11" />
            <stop offset="40%" stop-color="#0b1522" />
            <stop offset="100%" stop-color="#02060d" />
        </linearGradient>

        <!-- Cyberpunk Cyan Neon Glow -->
        <linearGradient id="cyanNeon" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#00f0ff" />
            <stop offset="100%" stop-color="#0077ff" />
        </linearGradient>

        <!-- Accent Orange/Amber Gradient -->
        <linearGradient id="accentOrange" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#ff9900" />
            <stop offset="100%" stop-color="#ff5500" />
        </linearGradient>

        <!-- Dark Metal Panels -->
        <linearGradient id="darkMetal" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#1f2d3d" />
            <stop offset="100%" stop-color="#0f172a" />
        </linearGradient>

        <!-- Grid Pattern for Sci-Fi Aesthetic -->
        <pattern id="cyberGrid" width="40" height="40" patternUnits="userSpaceOnUse">
            <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#00f0ff" stroke-width="0.5" stroke-opacity="0.15"/>
        </pattern>

        <!-- Frame Glow Filter -->
        <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur stdDeviation="6" result="blur" />
            <feComposite in="SourceGraphic" in2="blur" operator="over" />
        </filter>

        <!-- Clip Path for the Main Artwork Space (Angled Corners) -->
        <clipPath id="artClip">
            <polygon points="60,160 690,160 690,560 630,620 60,620" />
        </clipPath>
    </defs>

    <!-- LAYER 1: BASE BACKGROUND -->
    <rect width="750" height="1050" fill="url(#bgGrad)" />
    <rect width="750" height="1050" fill="url(#cyberGrid)" />

    <!-- Background Tech Lines / Circuit Details -->
    <path d="M 30,30 L 720,30 L 720,1020 L 30,1020 Z" fill="none" stroke="#00f0ff" stroke-width="1" stroke-opacity="0.2"/>
    <path d="M 45,15 L 705,15 M 15,45 L 15,1005" fill="none" stroke="#00f0ff" stroke-width="1" stroke-opacity="0.1"/>

    <!-- LAYER 2: PLACEHOLDER ARTWORK AREA (Clips custom image/art) -->
    <g clip-path="url(#artClip)">
        <!-- Deep Space / Nebula Mock Art Background -->
        <rect x="60" y="160" width="630" height="460" fill="#030914" />
        <circle cx="500" cy="300" r="180" fill="#0077ff" opacity="0.15" filter="blur(40px)" />
        <circle cx="200" cy="450" r="130" fill="#ff0055" opacity="0.1" filter="blur(50px)" />

        <!-- Reticle Grid lines on Art -->
        <circle cx="375" cy="380" r="120" fill="none" stroke="#00f0ff" stroke-width="1" stroke-opacity="0.2" stroke-dasharray="5,10"/>
        <line x1="375" y1="200" x2="375" y2="560" stroke="#00f0ff" stroke-width="0.5" stroke-opacity="0.2" stroke-dasharray="4,4"/>
        <line x1="150" y1="380" x2="600" y2="380" stroke="#00f0ff" stroke-width="0.5" stroke-opacity="0.2" stroke-dasharray="4,4"/>

        <!-- Prompt / Placeholder Text for Illustrator -->
        <text x="375" y="390" fill="#00f0ff" font-family="'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="bold" letter-spacing="3" text-anchor="middle" opacity="0.4">PLACE ARCHETYPAL ART HERE</text>
    </g>

    <!-- LAYER 3: INNER ART FRAME NEON INNER BORDER -->
    <polygon points="60,160 690,160 690,560 630,620 60,620" fill="none" stroke="url(#cyanNeon)" stroke-width="3" filter="url(#neonGlow)"/>

    <!-- LAYER 4: HEADER CARD BAR (Name & Casting Cost) -->
    <!-- Header Plate -->
    <polygon points="50,60 550,60 580,125 50,125" fill="url(#darkMetal)" stroke="#00f0ff" stroke-width="1.5"/>
    <polygon points="60,70 540,70 562,115 60,115" fill="#0d1b2a" opacity="0.8"/>
    <line x1="60" y1="70" x2="540" y2="70" stroke="#00f0ff" stroke-width="2"/>

    <!-- Card Title -->
    <text x="80" y="102" fill="#ffffff" font-family="'Segoe UI', Roboto, sans-serif" font-size="32" font-weight="900" letter-spacing="2">QUANTUM CORE</text>

    <!-- Energy/Resource Cost Hexagon -->
    <g transform="translate(640, 45)">
        <polygon points="45,0 90,26 90,78 45,104 0,78 0,26" fill="url(#darkMetal)" stroke="url(#accentOrange)" stroke-width="3" filter="url(#neonGlow)"/>
        <polygon points="41,4 82,28 82,72 41,96 0,72 0,28" fill="#110800" opacity="0.9"/>
        <text x="45" y="65" fill="url(#accentOrange)" font-family="'Segoe UI', Roboto, sans-serif" font-size="42" font-weight="bold" text-anchor="middle">7</text>
    </g>

    <!-- LAYER 5: CARD TYPE / SUBTYPE SUB-BAR -->
    <polygon points="80,600 450,600 470,635 80,635" fill="url(#darkMetal)" stroke="#00f0ff" stroke-width="1.5"/>
    <text x="100" y="625" fill="#00f0ff" font-family="'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="bold" letter-spacing="4">MECHA // ANOMALY</text>

    <!-- LAYER 6: TEXT BOX AREA (Rules, Abilities, Flavor) -->
    <!-- Main Text Plate Frame -->
    <polygon points="50,650 700,650 700,920 650,970 50,970" fill="url(#darkMetal)" stroke="#00f0ff" stroke-width="1.5" stroke-opacity="0.8"/>
    <!-- Internal Translucent Panel Base -->
    <polygon points="60,660 690,660 690,915 645,960 60,960" fill="#070f1e" fill-opacity="0.85"/>

    <!-- UI Accents inside Text Box -->
    <line x1="60" y1="660" x2="690" y2="660" stroke="#00f0ff" stroke-width="2"/>
    <rect x="75" y="680" width="6" height="6" fill="#ff9900" />

    <!-- Rules Text Descriptions -->
    <text x="95" y="698" fill="#ffffff" font-family="'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="600" letter-spacing="0.5">
        <tspan x="95" dy="0" font-weight="bold" fill="#ff9900">[OVERCHARGE]</tspan> Remove 2 energy cells from this card:
    </text>
    <text x="95" y="732" fill="#d1f4ff" font-family="'Segoe UI', Roboto, sans-serif" font-size="19" font-weight="normal" line-height="28">
        Deal <tspan fill="#00f0ff" font-weight="bold">400 Particle Damage</tspan> split across up to three target
    </text>
    <text x="95" y="762" fill="#d1f4ff" font-family="'Segoe UI', Roboto, sans-serif" font-size="19" font-weight="normal">
        opposing frontline Vanguard grids.
    </text>

    <!-- Passive Ability Line -->
    <line x1="95" y1="795" x2="655" y2="795" stroke="#00f0ff" stroke-width="1" stroke-opacity="0.2"/>

    <text x="95" y="830" fill="#ffffff" font-family="'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="600">
        <tspan font-weight="bold" fill="#00f0ff">Sync State:</tspan> Your adjacent biological units gain +1 Shield Regens.
    </text>

    <!-- Flavor Text -->
    <text x="95" y="910" fill="#6b8296" font-family="'Segoe UI', Roboto, sans-serif" font-size="16" font-style="italic">
        "The core sings at 14 terahertz. Few pilots can survive the harmony."
    </text>

    <!-- LAYER 7: BOTTOM STAT BADGES (Combat Power / Defense Shields) -->
    <!-- Left Corner: Attack Power Badge -->
    <g transform="translate(80, 930)">
        <polygon points="0,15 40,0 110,0 125,45 25,45" fill="#140509" stroke="#ff0055" stroke-width="2" filter="url(#neonGlow)"/>
        <text x="15" y="32" fill="#ff3377" font-family="'Impact', sans-serif" font-size="16" font-weight="bold" letter-spacing="1">ATK</text>
        <text x="105" y="36" fill="#ffffff" font-family="'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="900" text-anchor="end">850</text>
    </g>

    <!-- Right Corner: Shield/Defense Badge -->
    <g transform="translate(515, 930)">
        <polygon points="15,0 85,0 125,15 100,45 0,45" fill="#031624" stroke="#00f0ff" stroke-width="2" filter="url(#neonGlow)"/>
        <text x="110" y="32" fill="#33ccff" font-family="'Impact', sans-serif" font-size="16" font-weight="bold" letter-spacing="1" text-anchor="end">DEF</text>
        <text x="20" y="36" fill="#ffffff" font-family="'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="900" text-anchor="start">600</text>
    </g>

    <!-- LAYER 8: FRAME CORNER OVERLAYS (Industrial Trim Hardware) -->
    <!-- Top Left Corner Accent -->
    <polygon points="30,30 90,30 70,50 30,50" fill="#00f0ff" opacity="0.7"/>
    <polygon points="30,30 30,90 50,70 50,30" fill="#00f0ff" opacity="0.7"/>

    <!-- Top Right Corner Accent -->
    <polygon points="720,30 660,30 680,50 720,50" fill="#00f0ff" opacity="0.7"/>
    <polygon points="720,30 720,90 700,70 700,30" fill="#00f0ff" opacity="0.7"/>

    <!-- Footer Layout Metadata -->
    <text x="50" y="1005" fill="#3a4f63" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="bold" letter-spacing="1">ENG-001 // RARE</text>
    <text x="700" y="1005" fill="#3a4f63" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="bold" letter-spacing="1" text-anchor="end">© 2026 NEON MATRIX LABS</text>
</svg>
