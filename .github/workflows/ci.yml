name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # tsc -b, oxlint, and node --test scraper/ - the same command the
      # pre-commit hook runs (.githooks/pre-commit).
      - run: npm run check
      - run: npm run build
