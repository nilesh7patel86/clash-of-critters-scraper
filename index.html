<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Track your Tatari roster, evolutions, stars, grades, and badge bonuses in Clash of Critters." />
    <title>Tatari Roster &middot; Clash of Critters</title>
    <script>
      // Applied before first paint so the page never flashes the wrong theme.
      try {
        const theme = localStorage.getItem('tt_theme') || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
        document.documentElement.dataset.theme = theme
        document.documentElement.style.colorScheme = theme
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
