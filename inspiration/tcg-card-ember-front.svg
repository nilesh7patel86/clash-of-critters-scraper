<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="63mm" height="88mm" viewBox="0 0 630 880" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>Futuristic TCG Card Template: Ember</title>
  <desc>Editable sci-fi trading card frame. Groups: background, outer-frame, title-panel (cost, name, faction), artwork-window, type-ribbon, rules-panel, footer (attack, rarity, defense).</desc>
  <defs>
    <linearGradient id="bg" x2="0.9" y2="1"><stop stop-color="#0b1222"/><stop offset=".55" stop-color="#04070d"/><stop offset="1" stop-color="#150a12"/></linearGradient>
    <linearGradient id="metal" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="630" y2="880"><stop stop-color="#f5f8fc"/><stop offset=".2" stop-color="#5d6f88"/><stop offset=".4" stop-color="#0f1726"/><stop offset=".65" stop-color="#34445e"/><stop offset=".85" stop-color="#e6edf7"/><stop offset="1" stop-color="#26324a"/></linearGradient>
    <linearGradient id="ember" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="630" y2="880"><stop stop-color="#ffe08a"/><stop offset=".45" stop-color="#ff9a2e"/><stop offset="1" stop-color="#ff3d5a"/></linearGradient>
    <linearGradient id="ice" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="630" y2="880"><stop stop-color="#9ff5ff"/><stop offset=".45" stop-color="#2ba8ff"/><stop offset="1" stop-color="#6a5cff"/></linearGradient>
    <linearGradient id="panel" x2="0" y2="1"><stop stop-color="#101c31"/><stop offset=".5" stop-color="#08111f"/><stop offset="1" stop-color="#04080f"/></linearGradient>
    <radialGradient id="glowE"><stop stop-color="#ff7a1a" stop-opacity=".22"/><stop offset="1" stop-color="#ff7a1a" stop-opacity="0"/></radialGradient>
    <radialGradient id="glowI"><stop stop-color="#1fa0ff" stop-opacity=".24"/><stop offset="1" stop-color="#1fa0ff" stop-opacity="0"/></radialGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse"><rect width="4" height="1" fill="#9ff5ff" opacity=".06"/></pattern>
    <pattern id="hatch" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><path d="M0 0V10" stroke="#2ba8ff" stroke-width=".8" opacity=".14"/></pattern>
    <clipPath id="round"><rect x="8" y="8" width="614" height="864" rx="28"/></clipPath>
  </defs>

  <g font-family="Orbitron, Eurostile, Bahnschrift, Arial, sans-serif">

  <g id="background" clip-path="url(#round)">
    <rect width="630" height="880" fill="url(#bg)"/>
    <rect width="630" height="880" fill="url(#scan)"/>
    <ellipse cx="110" cy="300" rx="260" ry="380" fill="url(#glowI)"/>
    <ellipse cx="540" cy="620" rx="240" ry="320" fill="url(#glowE)"/>
  </g>

  <g id="outer-frame" fill="none">
    <rect x="8" y="8" width="614" height="864" rx="28" stroke="url(#metal)" stroke-width="8"/>
    <rect x="17" y="17" width="596" height="846" rx="22" stroke="url(#ember)" stroke-width="2" filter="url(#glow)"/>
    <path d="M27 230V300M27 600V670M603 230V300M603 600V670" stroke="url(#ice)" stroke-width="2.5"/>
  </g>

  <g id="title-panel">
    <path d="M112 36H245L262 26H368L385 36H518L540 58V90L518 112H112L90 90V58Z" fill="url(#panel)" stroke="url(#metal)" stroke-width="4"/>
    <path d="M118 44H248L265 35H365L382 44H512L531 62V86L512 104H118L99 86V62Z" fill="none" stroke="url(#ice)" stroke-width="2" filter="url(#glow)"/>
    <path d="M132 97H498" stroke="#2f6fa8" stroke-width="1" opacity=".7"/>
    <text x="315" y="84" fill="#f2f8ff" font-size="24" letter-spacing="5" text-anchor="middle">CARD NAME</text>

    <g id="cost-badge">
      <path d="M44 24H96L118 50V102L96 128H44L22 102V50Z" fill="url(#metal)" stroke="#e4f2ff" stroke-width="3"/>
      <path d="M52 34H88L106 54V98L88 118H52L34 98V54Z" fill="#0a0f1c" stroke="url(#ember)" stroke-width="3.5" filter="url(#glow)"/>
      <path d="M56 46H84L96 58V94L84 106H56L44 94V58Z" fill="#2a0f08" stroke="#ff9a2e" stroke-width="1.5"/>
      <text x="70" y="92" fill="#fff" font-size="40" font-weight="900" text-anchor="middle">0</text>
    </g>

    <g id="faction-insignia">
      <path d="M534 24H586L608 50V102L586 128H534L512 102V50Z" fill="url(#metal)" stroke="#e4f2ff" stroke-width="3"/>
      <circle cx="560" cy="76" r="34" fill="#070c1c" stroke="url(#ice)" stroke-width="3"/>
      <circle cx="560" cy="76" r="27" fill="none" stroke="#4a8cff" stroke-width="1.5"/>
      <path d="M560 52L582 94L560 84L538 94Z" fill="url(#ice)" stroke="#fff" stroke-width="1"/>
    </g>
  </g>

  <g id="artwork-window">
    <path d="M60 148H570L596 172V454L570 480H60L34 454V172Z" fill="#02050b" stroke="url(#metal)" stroke-width="5"/>
    <path d="M68 157H562L586 178V448L562 471H68L44 448V178Z" fill="url(#glowI)" stroke="url(#ember)" stroke-width="2" filter="url(#glow)"/>
    <path d="M68 157H562L586 178V448L562 471H68L44 448V178Z" fill="url(#scan)"/>
    <path d="M46 200V180L68 159H96M584 200V180L562 159H534M46 426V446L68 469H96M584 426V446L562 469H534" fill="none" stroke="url(#ice)" stroke-width="3"/>
    <g fill="none" stroke="#6e9dce" opacity=".7">
      <circle cx="315" cy="300" r="46"/>
      <path d="M315 242V268M315 332V358M257 300H283M347 300H373" stroke-width="1.5"/>
    </g>
    <text x="315" y="400" fill="#8ba9d0" font-size="15" letter-spacing="4" text-anchor="middle">ARTWORK AREA</text>
    <text x="315" y="420" fill="#43678f" font-family="Arial, sans-serif" font-size="9" letter-spacing="2" text-anchor="middle">PLACE ILLUSTRATION HERE</text>
  </g>

  <g id="type-ribbon">
    <path d="M70 490H560L584 509L560 528H70L46 509Z" fill="url(#panel)" stroke="url(#metal)" stroke-width="3"/>
    <path d="M80 497H552L570 509L552 521H80L62 509Z" fill="none" stroke="url(#ember)" stroke-width="2"/>
    <path d="M96 503L104 509L96 515L88 509ZM534 503L542 509L534 515L526 509Z" fill="url(#ice)"/>
    <text x="315" y="514" fill="#e9f5ff" font-size="14" letter-spacing="3" text-anchor="middle">TYPE / FACTION</text>
  </g>

  <g id="rules-panel">
    <path d="M62 538H568L592 560V752L568 776H62L38 752V560Z" fill="url(#panel)" stroke="url(#metal)" stroke-width="4"/>
    <path d="M70 547H560L582 566V746L560 767H70L48 746V566Z" fill="url(#hatch)" stroke="url(#ice)" stroke-width="2"/>
    <path d="M54 584V570L68 556H92M576 584V570L562 556H538M54 730V744L68 758H92M576 730V744L562 758H538" fill="none" stroke="url(#ember)" stroke-width="2"/>
    <text x="74" y="594" fill="#ffbf5e" font-size="15" letter-spacing="2">ABILITY NAME</text>
    <g font-family="Arial, sans-serif" font-size="11.5" fill="#8fa8c8">
      <text x="74" y="620">Add card effects and rules text here.</text>
      <text x="74" y="638">Keep each line short so it stays inside</text>
      <text x="74" y="656">the panel, and add a second ability below.</text>
    </g>
    <path d="M74 690H556" stroke="#1f5a8c" stroke-dasharray="3 5"/>
    <g font-family="Georgia, serif" font-style="italic" font-size="11" fill="#5f7798">
      <text x="74" y="714">Flavor text sits here, set apart from the rules.</text>
    </g>
  </g>

  <g id="footer">
    <!-- Attack -->
    <path d="M40 788H192L214 808V842L192 862H40L22 842V808Z" fill="url(#panel)" stroke="url(#metal)" stroke-width="4"/>
    <path d="M46 796H188L204 811V839L188 854H46L32 839V811Z" fill="none" stroke="url(#ember)" stroke-width="2.5" filter="url(#glow)"/>
    <g transform="translate(70 826)" stroke="#fff0d0" stroke-linecap="round" fill="none"><path d="M-4 4L16 -16" stroke-width="4"/><path d="M-10 -2L2 10" stroke-width="4"/><path d="M-4 4L-13 13" stroke-width="5"/><circle cx="-16" cy="16" r="3" fill="#fff0d0" stroke="none"/></g>
    <text x="148" y="840" fill="#fff" font-size="42" font-weight="900" text-anchor="middle">0</text>
    <!-- Defense -->
    <path d="M590 788H438L416 808V842L438 862H590L608 842V808Z" fill="url(#panel)" stroke="url(#metal)" stroke-width="4"/>
    <path d="M584 796H442L426 811V839L442 854H584L598 839V811Z" fill="none" stroke="url(#ice)" stroke-width="2.5" filter="url(#glow)"/>
    <g transform="translate(462 821)"><path d="M0 -18L17 -11V7Q17 20 0 28Q-17 20 -17 7V-11Z" fill="#2ba8ff" fill-opacity=".2" stroke="#bfe6ff" stroke-width="3.5"/><path d="M0 -9L9 -5V6Q9 12 0 17Q-9 12 -9 6V-5Z" fill="none" stroke="#e6f5ff" stroke-width="1.8"/></g>
    <text x="548" y="840" fill="#fff" font-size="42" font-weight="900" text-anchor="middle">0</text>
    <!-- Rarity -->
    <path d="M224 806L244 793H386L406 806V846L386 859H244L224 846Z" fill="url(#panel)" stroke="url(#ember)" stroke-width="2.5"/>
    <g id="rarity-gems" fill="url(#ember)" stroke="#fff0b0" stroke-width=".6">
      <path d="M256 818L263 808L270 818L263 828Z"/>
      <path d="M282 818L289 808L296 818L289 828Z"/>
      <path d="M308 818L315 808L322 818L315 828Z"/>
      <path d="M334 818L341 808L348 818L341 828Z"/>
      <path d="M360 818L367 808L374 818L367 828Z"/>
    </g>
    <text x="315" y="848" fill="#ffbf5e" font-size="11" letter-spacing="4" text-anchor="middle">RARITY</text>
  </g>

  </g>
</svg>
