<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="63mm" height="88mm" viewBox="0 0 630 880">
<title>07 Dual Transform</title><defs>
<linearGradient id="bg" x2="1" y2="1"><stop stop-color="#030a17"/><stop offset=".6" stop-color="#0b1730"/><stop offset="1" stop-color="#030a17"/></linearGradient>
<linearGradient id="edge" x2="1" y2="1"><stop stop-color="#355477"/><stop offset=".5" stop-color="#38c7ff"/><stop offset="1" stop-color="#b84cff"/></linearGradient>
<pattern id="grid" width="18" height="18" patternUnits="userSpaceOnUse"><path d="M18 0H0V18" fill="none" stroke="#355477" stroke-width=".5" opacity=".2"/></pattern>
<pattern id="dots" width="14" height="14" patternUnits="userSpaceOnUse"><circle cx="3" cy="3" r="1" fill="#38c7ff" opacity=".28"/></pattern>
</defs>
<rect x="8" y="8" width="614" height="864" rx="22" fill="url(#bg)" stroke="#f5fbff" stroke-width="4"/>
<rect x="22" y="22" width="586" height="836" rx="15" fill="url(#grid)"/>

<g id="header"><path d="M28 34H602V108H28Z" fill="#071426" stroke="#38c7ff" stroke-width="3"/><circle cx="67" cy="71" r="28" fill="#071d34" stroke="#38c7ff" stroke-width="4"/><text x="67" y="81" font-family="Arial, Helvetica, sans-serif" font-size="28" fill="#f5fbff" text-anchor="middle">4</text><text x="112" y="68" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="bold" fill="#f5fbff">CARD NAME</text><text x="112" y="91" font-family="Arial, Helvetica, sans-serif" font-size="9" letter-spacing="3" fill="#b84cff">DUAL • TRANSFORM</text></g>
<g id="dual_art"><rect x="38" y="132" width="554" height="343" fill="#030711" stroke="#38c7ff" stroke-width="4"/><path d="M315 132V475" stroke="#b84cff" stroke-width="3"/><rect x="50" y="145" width="253" height="317" fill="url(#dots)"/><rect x="327" y="145" width="253" height="317" fill="url(#dots)"/><text x="176" y="307" font-family="Arial, Helvetica, sans-serif" font-size="16" letter-spacing="4" fill="#38c7ff" text-anchor="middle">STATE A</text><text x="452" y="307" font-family="Arial, Helvetica, sans-serif" font-size="16" letter-spacing="4" fill="#b84cff" text-anchor="middle">STATE B</text><circle cx="315" cy="304" r="27" fill="#071426" stroke="#f5fbff" stroke-width="3"/><text x="315" y="311" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#f5fbff" text-anchor="middle">↻</text></g>
<g id="transform"><path d="M38 500H592V555H38Z" fill="#071426" stroke="#b84cff" stroke-width="2"/><text x="315" y="535" font-family="Arial, Helvetica, sans-serif" font-size="10" letter-spacing="4" fill="#f5fbff" text-anchor="middle">TRANSFORM CONDITION</text><rect x="38" y="575" width="554" height="235" fill="#050c18" stroke="#38c7ff" stroke-width="3"/><text x="70" y="615" font-family="Arial, Helvetica, sans-serif" font-size="10" letter-spacing="3" fill="#38c7ff">STATE A EFFECT</text><text x="70" y="646" font-family="Arial, Helvetica, sans-serif" font-size="9" fill="#738da7">First form rules and abilities.</text><text x="70" y="682" font-family="Arial, Helvetica, sans-serif" font-size="10" letter-spacing="3" fill="#b84cff">STATE B EFFECT</text><text x="70" y="713" font-family="Arial, Helvetica, sans-serif" font-size="9" fill="#738da7">Transformed form rules and abilities.</text><path d="M70 745H560" stroke="#355477"/><text x="315" y="778" font-family="Arial, Helvetica, sans-serif" font-size="10" letter-spacing="4" fill="#f5fbff" text-anchor="middle">EVOLUTION / DUAL STATE</text></g>
</svg>