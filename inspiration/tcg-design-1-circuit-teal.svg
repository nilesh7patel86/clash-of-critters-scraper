<svg xmlns="http://www.w3.org/2000/svg" width="63mm" height="88mm" viewBox="0 0 630 880" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>TCG Card: Circuit (teal)</title>
  <defs>
    <linearGradient id="a" x2="1" y2="1"><stop stop-color="#5df2c2"/><stop offset="1" stop-color="#0f9d78"/></linearGradient>
    <linearGradient id="p" x2="0" y2="1"><stop stop-color="#13262c"/><stop offset="1" stop-color="#091317"/></linearGradient>
    <linearGradient id="art" x2="0" y2="1"><stop stop-color="#0f2e2c"/><stop offset="1" stop-color="#050b0d"/></linearGradient>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse"><path d="M20 0H0V20" fill="none" stroke="#5df2c2" stroke-opacity=".07"/></pattern>
    <filter id="g" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <g font-family="Orbitron, Eurostile, Bahnschrift, Arial, sans-serif">
    <rect x="1" y="1" width="628" height="878" rx="20" fill="#090e11" stroke="#1d2a2e" stroke-width="2"/>
    <path d="M420 0H610Q630 0 630 20V860Q630 880 610 880H250Z" fill="#fff" opacity=".025"/>
    <path d="M22 170L40 152V670L22 688Z" fill="url(#a)" opacity=".6"/>

    <!-- Offset frame, art window -->
    <path d="M64 102H392L410 84H584V466L560 490H48V118Z" fill="none" stroke="url(#a)" stroke-width="2" opacity=".55"/>
    <path d="M74 112H396L414 94H574V462L556 480H58V128Z" fill="url(#art)"/>
    <path d="M74 112H396L414 94H574V462L556 480H58V128Z" fill="url(#grid)"/>
    <text x="316" y="296" font-size="15" letter-spacing="4" fill="#4f8f80" text-anchor="middle">ARTWORK AREA</text>
    <path d="M74 112H396L414 94H574V462L556 480H58V128Z" fill="none" stroke="url(#a)" stroke-width="4" filter="url(#g)"/>

    <!-- Type tab, faction emblem -->
    <path d="M380 88L398 60H588V88Z" fill="url(#a)"/>
    <text x="494" y="80" font-size="13" font-weight="700" fill="#04231b" text-anchor="middle">Unit: Cyber Drone</text>
    <circle cx="86" cy="86" r="30" fill="#090e11" stroke="url(#a)" stroke-width="3"/>
    <circle cx="86" cy="86" r="23" fill="none" stroke="#1f6b58"/>
    <path d="M86 70L100 86L86 102L72 86Z" fill="url(#a)"/>

    <!-- Rarity column -->
    <g fill="url(#a)">
      <path d="M604 398L610 404L604 410L598 404Z"/><path d="M604 418L610 424L604 430L598 424Z"/><path d="M604 438L610 444L604 450L598 444Z"/><path d="M604 458L610 464L604 470L598 464Z"/><path d="M604 478L610 484L604 490L598 484Z"/>
    </g>

    <!-- Rules panel -->
    <path d="M58 500H556L574 518V742H76L58 724Z" fill="url(#p)" stroke="#1c5c4c" stroke-width="1.5"/>
    <text x="80" y="538" font-size="15" font-weight="700" fill="#5df2c2" letter-spacing="1">Ability name</text>
    <g font-family="Arial, sans-serif" font-size="12.5" fill="#9fc4bb">
      <text x="80" y="564">Add card effects and rules text here. Keep each</text>
      <text x="80" y="584">line short so it stays inside the panel, and add</text>
      <text x="80" y="604">a second ability below if the card needs one.</text>
    </g>
    <path d="M80 650H552" stroke="#1c5c4c" stroke-dasharray="3 5"/>
    <g font-family="Georgia, serif" font-style="italic" font-size="12" fill="#5f8a80">
      <text x="80" y="676">Flavor text sits here, set apart from the rules.</text>
    </g>

    <!-- Bottom bar: cost block, name, stats -->
    <rect x="58" y="756" width="76" height="80" fill="#04070a" stroke="#1c5c4c"/>
    <text x="96" y="776" font-size="10" fill="#5df2c2" text-anchor="middle">Cost</text>
    <text x="96" y="822" font-size="44" font-weight="900" fill="#fff" text-anchor="middle">3</text>
    <path d="M134 756H556L574 774V836H134Z" fill="url(#a)"/>
    <text x="150" y="796" font-size="28" font-weight="900" fill="#04231b">Card Name</text>
    <text x="150" y="820" font-size="12" fill="#04231b" opacity=".8">Faction name</text>
    <rect x="442" y="780" width="62" height="56" fill="#04070a"/>
    <rect x="510" y="780" width="64" height="56" fill="#04070a"/>
    <g text-anchor="middle">
      <text x="473" y="797" font-size="10" fill="#5df2c2">Attack</text><text x="473" y="828" font-size="30" font-weight="900" fill="#fff">4</text>
      <text x="542" y="797" font-size="10" fill="#5df2c2">Defense</text><text x="542" y="828" font-size="30" font-weight="900" fill="#fff">5</text>
    </g>
    <text x="316" y="860" font-size="10" fill="#4f7a70" text-anchor="middle" letter-spacing="1">Illustrated by Artist Name    001/250</text>
  </g>
</svg>
