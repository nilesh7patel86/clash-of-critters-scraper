<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="63mm" height="88mm" viewBox="0 0 630 880" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>TCG Card: Pill (azure)</title>
  <defs>
    <linearGradient id="bg" x2="0" y2="1"><stop stop-color="#1a8cff"/><stop offset="1" stop-color="#62e3ff"/></linearGradient>
    <linearGradient id="art" x2="0" y2="1"><stop stop-color="#0d3470"/><stop offset="1" stop-color="#061a3c"/></linearGradient>
    <pattern id="s" width="8" height="8" patternUnits="userSpaceOnUse"><rect width="3" height="8" fill="#fff" opacity=".1"/></pattern>
    <path id="st" d="M0 -7L2 -2.2 7.2 -2.2 3 0.9 4.5 6 0 3 -4.5 6 -3 0.9 -7.2 -2.2 -2 -2.2Z"/>
  </defs>
  <g font-family="'Trebuchet MS', 'Segoe UI', Arial, sans-serif">
    <rect width="630" height="880" rx="18" fill="url(#bg)"/>
    <rect width="630" height="880" rx="18" fill="url(#s)"/>
    <path d="M0 18Q0 0 18 0H612Q630 0 630 18V26H0Z M0 854H630V862Q630 880 612 880H18Q0 880 0 862Z" fill="#1556c9"/>

    <!-- Art window -->
    <rect x="36" y="96" width="558" height="372" rx="40" fill="url(#art)" stroke="#12408f" stroke-width="5"/>
    <text x="315" y="290" font-size="16" font-weight="700" letter-spacing="3" fill="#4f7fc4" text-anchor="middle">ARTWORK AREA</text>

    <!-- Rarity pill, faction tab -->
    <rect x="56" y="80" width="140" height="28" rx="14" fill="#1556c9"/>
    <g fill="#fff"><use xlink:href="#st" x="86" y="94"/><use xlink:href="#st" x="106" y="94"/><use xlink:href="#st" x="126" y="94"/><use xlink:href="#st" x="146" y="94"/><use xlink:href="#st" x="166" y="94"/></g>
    <path d="M410 80H578L568 108H392Z" fill="#1556c9" stroke="#1556c9" stroke-width="10" stroke-linejoin="round"/>
    <text x="480" y="100" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">Faction name</text>

    <!-- Cost circle, name pill -->
    <path d="M262 448H574L564 482H246Z" fill="#1556c9" stroke="#1556c9" stroke-width="10" stroke-linejoin="round"/>
    <text x="410" y="473" font-size="24" font-weight="800" fill="#fff" text-anchor="middle">Card Name</text>
    <circle cx="88" cy="460" r="34" fill="#0f3f9e" stroke="#fff" stroke-width="4"/>
    <text x="88" y="473" font-size="36" font-weight="800" fill="#fff" text-anchor="middle">3</text>

    <!-- Rules panel -->
    <rect x="36" y="512" width="558" height="214" rx="26" fill="#0b2f6e" fill-opacity=".92"/>
    <text x="64" y="548" font-size="17" font-weight="700" fill="#7fe9ff">Ability name</text>
    <g font-size="13" fill="#fff" fill-opacity=".88">
      <text x="64" y="576">Add card effects and rules text here. Keep each</text>
      <text x="64" y="596">line short so it stays inside the panel, and add</text>
      <text x="64" y="616">a second ability below if the card needs one.</text>
    </g>
    <path d="M64 656H566" stroke="#7fb4ff" stroke-opacity=".5" stroke-dasharray="3 5"/>
    <g font-family="Georgia, serif" font-style="italic" font-size="12.5" fill="#9fc7ff">
      <text x="64" y="684">Flavor text sits here, set apart from the rules.</text>
    </g>

    <!-- Stat pills -->
    <rect x="36" y="746" width="170" height="62" rx="31" fill="#1556c9"/>
    <text x="68" y="782" font-size="13" font-weight="700" fill="#fff" fill-opacity=".8">Attack</text>
    <text x="184" y="788" font-size="32" font-weight="800" fill="#fff" text-anchor="end">4</text>
    <rect x="424" y="746" width="170" height="62" rx="31" fill="#1556c9"/>
    <text x="456" y="782" font-size="13" font-weight="700" fill="#fff" fill-opacity=".8">Defense</text>
    <text x="572" y="788" font-size="32" font-weight="800" fill="#fff" text-anchor="end">5</text>
    <rect x="222" y="758" width="186" height="38" rx="19" fill="#0f3f9e"/>
    <text x="315" y="782" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">Unit: Cyber Drone</text>
    <text x="315" y="836" font-size="11" fill="#0c3f93" text-anchor="middle" letter-spacing="1">Illustrated by Artist Name    001/250</text>
  </g>
</svg>
