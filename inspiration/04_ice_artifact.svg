<rect x="22" y="22" width="586" height="836" rx="15" fill="url(#grid)"/>

<g id="header"><path d="M28 34H602V116H28Z" fill="#f7fbfd" stroke="#7897a9" stroke-width="3"/><circle cx="68" cy="75" r="28" fill="#e7f3f8" stroke="#18b9d5" stroke-width="4"/><text x="68" y="85" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="bold" fill="#173247" text-anchor="middle">1</text><text x="112" y="69" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="bold" fill="#173247">CARD NAME</text><text x="112" y="94" font-family="Arial, Helvetica, sans-serif" font-size="9" letter-spacing="3" fill="#18b9d5">ARTIFACT / EQUIPMENT</text></g>
<g id="artifact_art"><rect x="40" y="140" width="550" height="330" rx="20" fill="#f7fbfd" stroke="#7897a9" stroke-width="3"/><circle cx="315" cy="305" r="115" fill="#e4f1f7" stroke="#18b9d5" stroke-width="3"/><circle cx="315" cy="305" r="82" fill="none" stroke="#527dff" stroke-width="2"/><circle cx="315" cy="305" r="45" fill="#fff" stroke="#18b9d5" stroke-width="3"/><text x="315" y="312" font-family="Arial, Helvetica, sans-serif" font-size="12" letter-spacing="3" fill="#698493" text-anchor="middle">ARTIFACT CORE</text></g>
<g id="equipment"><path d="M40 490H590V550H40Z" fill="#edf7fb" stroke="#18b9d5" stroke-width="2"/><text x="65" y="527" font-family="Arial, Helvetica, sans-serif" font-size="10" letter-spacing="3" fill="#18b9d5">EQUIPMENT</text><rect x="40" y="570" width="550" height="240" rx="12" fill="#f8fcff" stroke="#7897a9" stroke-width="2"/><text x="68" y="610" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#173247">EQUIP EFFECT</text><text x="68" y="642" font-family="Arial, Helvetica, sans-serif" font-size="9" fill="#698493">• Equip to target creature.</text><text x="68" y="663" font-family="Arial, Helvetica, sans-serif" font-size="9" fill="#698493">• Grants +2/+2 and one special keyword.</text><text x="68" y="684" font-family="Arial, Helvetica, sans-serif" font-size="9" fill="#698493">• Optional secondary effect.</text><path d="M68 715H562" stroke="#7897a9"/><text x="315" y="758" font-family="Arial, Helvetica, sans-serif" font-size="9" letter-spacing="4" fill="#527dff" text-anchor="middle">RELIC OF A FORGOTTEN AGE</text></g>
</svg>