<linearGradient id="edge" x2="1" y2="1"><stop stop-color="#7897a9"/><stop offset=".5" stop-color="#18b9d5"/><stop offset="1" stop-color="#527dff"/></linearGradient>
<pattern id="grid" width="18" height="18" patternUnits="userSpaceOnUse"><path d="M18 0H0V18" fill="none" stroke="#7897a9" stroke-width=".5" opacity=".2"/></pattern>
