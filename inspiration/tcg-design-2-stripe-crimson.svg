<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="63mm" height="88mm" viewBox="0 0 630 880" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>TCG Card: Stripe (crimson)</title>
  <defs>
    <linearGradient id="bg" x2="0" y2="1"><stop stop-color="#701818"/><stop offset="1" stop-color="#340808"/></linearGradient>
    <linearGradient id="or" x2="1" y2="1"><stop stop-color="#ffb347"/><stop offset="1" stop-color="#ff7a00"/></linearGradient>
    <linearGradient id="art" x2="0" y2="1"><stop stop-color="#3a0d0d"/><stop offset="1" stop-color="#170404"/></linearGradient>
    <pattern id="s" width="6" height="6" patternUnits="userSpaceOnUse"><rect width="2" height="6" fill="#000" opacity=".2"/></pattern>
    <path id="st" d="M0 -7L2 -2.2 7.2 -2.2 3 0.9 4.5 6 0 3 -4.5 6 -3 0.9 -7.2 -2.2 -2 -2.2Z"/>
  </defs>
  <g font-family="Bahnschrift, 'Arial Narrow', Arial, sans-serif">
    <rect width="630" height="880" rx="16" fill="url(#bg)"/>
    <rect width="630" height="880" rx="16" fill="url(#s)"/>
    <rect x="3" y="3" width="624" height="874" rx="14" fill="none" stroke="#ff8c1a" stroke-width="6"/>
    <path d="M30 22H600" stroke="#ff8c1a" stroke-width="3" stroke-dasharray="14 8" opacity=".5"/>

    <!-- Art window -->
    <path d="M62 58H568L584 74V458L568 474H62L46 458V74Z" fill="url(#art)"/>
    <text x="315" y="272" font-size="16" font-weight="700" letter-spacing="4" fill="#a2523a" text-anchor="middle">ARTWORK AREA</text>
    <path d="M66 66H564L576 78V454L564 466H66L54 454V78Z" fill="none" stroke="#ff8c1a" stroke-opacity=".4"/>
    <path d="M62 58H568L584 74V458L568 474H62L46 458V74Z" fill="none" stroke="#ff8c1a" stroke-width="4"/>

    <!-- Faction emblem, rarity chip -->
    <circle cx="92" cy="104" r="26" fill="#2a0707" stroke="#ff8c1a" stroke-width="3"/>
    <path d="M80 112L92 92L104 112L92 106Z" fill="url(#or)"/>
    <rect x="524" y="70" width="52" height="100" rx="8" fill="#2a0707" fill-opacity=".85" stroke="#ff8c1a" stroke-width="1.5"/>
    <g fill="#ffb347">
      <use xlink:href="#st" x="550" y="90"/><use xlink:href="#st" x="550" y="108"/><use xlink:href="#st" x="550" y="126"/><use xlink:href="#st" x="550" y="144"/><use xlink:href="#st" x="550" y="162"/>
    </g>

    <!-- Tagline row -->
    <text x="48" y="496" font-size="13" font-weight="700" fill="#ff9a3c">#Faction name</text>
    <text x="582" y="496" font-size="13" font-weight="700" font-style="italic" fill="#ffb347" text-anchor="end">Unit: Cyber Drone</text>

    <!-- Rules panel -->
    <rect x="46" y="508" width="538" height="210" rx="10" fill="#2a0808" fill-opacity=".92" stroke="#ff8c1a" stroke-opacity=".6" stroke-width="1.5"/>
    <text x="66" y="540" font-size="17" font-weight="700" fill="#ff9a3c">Ability name</text>
    <g font-family="Arial, sans-serif" font-size="12.5" fill="#f3c9a8">
      <text x="66" y="566">Add card effects and rules text here. Keep each line</text>
      <text x="66" y="586">short so it stays inside the panel, and add a second</text>
      <text x="66" y="606">ability below if the card needs one.</text>
    </g>
    <path d="M66 650H564" stroke="#ff8c1a" stroke-opacity=".4" stroke-dasharray="3 5"/>
    <g font-family="Georgia, serif" font-style="italic" font-size="12" fill="#c98f6a">
      <text x="66" y="676">Flavor text sits here, set apart from the rules.</text>
    </g>

    <!-- Cost block, name panel, stats -->
    <path d="M46 730H142V840H70L46 816Z" fill="#240606" stroke="#ff8c1a" stroke-width="3"/>
    <text x="94" y="752" font-size="11" font-weight="700" fill="#ff9a3c" text-anchor="middle">Cost</text>
    <text x="94" y="812" font-size="62" font-weight="900" fill="#ffb347" text-anchor="middle">3</text>
    <path d="M142 730H560L584 754V840H142Z" fill="url(#or)"/>
    <text x="160" y="776" font-size="32" font-weight="900" fill="#3a0a0a">Card Name</text>
    <text x="160" y="802" font-size="14" font-weight="700" fill="#5a1a0a">Set Code   001/250</text>
    <rect x="410" y="782" width="82" height="46" rx="8" fill="#3a0a0a"/>
    <rect x="500" y="782" width="82" height="46" rx="8" fill="#3a0a0a"/>
    <g fill="#ffb347" font-weight="900">
      <text x="420" y="811" font-size="11">Attack</text><text x="482" y="814" font-size="28" text-anchor="end" fill="#fff">4</text>
      <text x="510" y="811" font-size="11">Defense</text><text x="572" y="814" font-size="28" text-anchor="end" fill="#fff">5</text>
    </g>
  </g>
</svg>
