<path d="M214 122H596" stroke="#ffffff" stroke-opacity=".9" stroke-width="2.5" filter="url(#g)"/>
<g font-family="Orbitron, Eurostile, Bahnschrift, 'Segoe UI', Arial, sans-serif" font-size="36" font-weight="700" letter-spacing="3" text-anchor="middle">
