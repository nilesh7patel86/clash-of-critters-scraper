<text x="315" y="327" font-family="Orbitron, Eurostile, Bahnschrift, 'Segoe UI', Arial, sans-serif" font-size="15" letter-spacing="4" fill="#4a3a86" text-anchor="middle">ARTWORK AREA</text><rect x="34" y="520" width="562" height="26" fill="url(#steel)"/>
