<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="69mm" height="94mm" viewBox="-30 -20 690 940" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>Neon Layout 1 with effects</title>
<defs>
  <linearGradient id="frame" x2="1" y2="1"><stop stop-color="#ff2a6d"/><stop offset=".4" stop-color="#b026ff"/><stop offset=".75" stop-color="#05d9e8"/><stop offset="1" stop-color="#39ff14"/></linearGradient>
  <linearGradient id="steel" x2="1" y2="0"><stop stop-color="#ff2a6d"/><stop offset=".5" stop-color="#b026ff"/><stop offset="1" stop-color="#05d9e8"/></linearGradient>
  <linearGradient id="tile" x2="0" y2="1"><stop stop-color="#1e0a3c"/><stop offset="1" stop-color="#0d041f"/></linearGradient>
  <linearGradient id="panel" x2="0" y2="1"><stop stop-color="#170b34"/><stop offset="1" stop-color="#0a0518"/></linearGradient>
  <linearGradient id="art" x2="0" y2="1"><stop stop-color="#0c0720"/><stop offset="1" stop-color="#12083a"/></linearGradient>
  <linearGradient id="neon" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="630" y2="0"><stop stop-color="#05d9e8"/><stop offset="1" stop-color="#ff2a6d"/></linearGradient>
  <radialGradient id="gc"><stop stop-color="#05d9e8" stop-opacity=".18"/><stop offset="1" stop-color="#05d9e8" stop-opacity="0"/></radialGradient>
  <radialGradient id="gm"><stop stop-color="#ff2a6d" stop-opacity=".16"/><stop offset="1" stop-color="#ff2a6d" stop-opacity="0"/></radialGradient>
  <filter id="g" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="2.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse"><rect width="4" height="1" fill="#05d9e8" opacity=".07"/></pattern>
  <pattern id="hz" width="14" height="14" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="7" height="14" fill="#f9f002"/><rect x="7" width="7" height="14" fill="#10131a"/></pattern>
  <path id="st" d="M0 -9L2.6 -3 9 -2.8 4.2 1.4 5.6 8 0 4.5 -5.6 8 -4.2 1.4 -9 -2.8 -2.6 -3Z"/>
<radialGradient id="bd" cx=".5" cy=".45" r=".7"><stop stop-color="#2e2160"/><stop offset="1" stop-color="#090514"/></radialGradient>
  <linearGradient id="sheen" gradientUnits="userSpaceOnUse" x1="-300" y1="134" x2="-120" y2="330">
    <stop stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#9ff5ff" stop-opacity=".28"/><stop offset="1" stop-color="#fff" stop-opacity="0"/>
    <animateTransform attributeName="gradientTransform" type="translate" values="0 0;1000 0;1000 0" keyTimes="0;.6;1" dur="6s" repeatCount="indefinite"/>
  </linearGradient>
  <filter id="ds" x="-20%" y="-20%" width="140%" height="140%">
    <feGaussianBlur in="SourceAlpha" stdDeviation="14" result="b"/>
    <feOffset in="b" dx="0" dy="16" result="o"/>
    <feFlood flood-color="#000" flood-opacity=".9"/>
    <feComposite in2="o" operator="in" result="s"/>
    <feMerge><feMergeNode in="s"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="inner" x="-10%" y="-10%" width="120%" height="120%">
    <feFlood flood-color="#000" flood-opacity=".9" result="f"/>
    <feComposite in="f" in2="SourceAlpha" operator="out" result="inv"/>
    <feGaussianBlur in="inv" stdDeviation="9" result="bl"/>
    <feOffset in="bl" dx="3" dy="6" result="of"/>
    <feComposite in="of" in2="SourceAlpha" operator="in" result="sh"/>
    <feMerge><feMergeNode in="SourceGraphic"/><feMergeNode in="sh"/></feMerge>
  </filter>
  <filter id="bevel" x="-5%" y="-10%" width="110%" height="120%">
    <feGaussianBlur in="SourceAlpha" stdDeviation="3.5" result="b"/>
    <feSpecularLighting in="b" surfaceScale="5" specularConstant="1" specularExponent="20" lighting-color="#fff" result="sp"><fePointLight x="230" y="0" z="90"/></feSpecularLighting>
    <feComposite in="sp" in2="SourceAlpha" operator="in" result="spc"/>
    <feComposite in="SourceGraphic" in2="spc" operator="arithmetic" k1="0" k2="1" k3="1" k4="0"/>
  </filter>
  <filter id="grain" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
    <feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="2" seed="3" result="n"/>
    <feColorMatrix in="n" type="matrix" values=".33 .33 .33 0 0  .33 .33 .33 0 0  .33 .33 .33 0 0  0 0 0 .16 0" result="g"/>
    <feComposite in="g" in2="SourceAlpha" operator="in"/>
  </filter>
</defs>
