<g clip-path="url(#ac)"><ellipse cx="520" cy="200" rx="260" ry="180" fill="url(#gc)"/><ellipse cx="110" cy="460" rx="240" ry="170" fill="url(#gm)"/><rect x="34" y="134" width="562" height="386" fill="url(#scan)"/></g>
<path d="M34 134H596V492H404L384 520H34Z" fill="none" stroke="url(#neon)" stroke-width="1.5" opacity=".55"/>
