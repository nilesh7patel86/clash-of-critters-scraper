<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="63mm" height="88mm" viewBox="0 0 630 880">
<title>02 Character Portrait</title><defs>
<linearGradient id="bg" x2="1" y2="1"><stop stop-color="#020812"/><stop offset=".6" stop-color="#071c2b"/><stop offset="1" stop-color="#020812"/></linearGradient>
<linearGradient id="edge" x2="1" y2="1"><stop stop-color="#40687c"/><stop offset=".5" stop-color="#22d8ff"/><stop offset="1" stop-color="#9b5cff"/></linearGradient>
<pattern id="grid" width="18" height="18" patternUnits="userSpaceOnUse"><path d="M18 0H0V18" fill="none" stroke="#40687c" stroke-width=".5" opacity=".2"/></pattern>
<pattern id="dots" width="14" height="14" patternUnits="userSpaceOnUse"><circle cx="3" cy="3" r="1" fill="#22d8ff" opacity=".28"/></pattern>
</defs>
<rect x="8" y="8" width="614" height="864" rx="22" fill="url(#bg)" stroke="#effcff" stroke-width="4"/>
<rect x="22" y="22" width="586" height="836" rx="15" fill="url(#grid)"/>

<g id="header"><path d="M28 32H602V110H28Z" fill="#061521" stroke="#22d8ff" stroke-width="3"/><circle cx="68" cy="71" r="29" fill="#071d2b" stroke="#22d8ff" stroke-width="4"/><text x="68" y="81" font-family="Arial, Helvetica, sans-serif" font-size="28" fill="#effcff" text-anchor="middle">3</text><text x="112" y="67" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="bold" fill="#effcff">CARD NAME</text><text x="112" y="91" font-family="Arial, Helvetica, sans-serif" font-size="9" letter-spacing="3" fill="#22d8ff">CHARACTER</text></g>
<g id="portrait"><rect x="38" y="130" width="395" height="310" rx="12" fill="#02070c" stroke="#22d8ff" stroke-width="4"/><rect x="52" y="144" width="367" height="282" fill="url(#dots)"/><text x="235" y="300" font-family="Arial, Helvetica, sans-serif" font-size="17" letter-spacing="5" fill="#7895aa" text-anchor="middle">PORTRAIT ART</text></g>
<g id="stats_rail"><path d="M450 130H592V440H450Z" fill="#071521" stroke="#9b5cff" stroke-width="3"/><text x="521" y="166" font-family="Arial, Helvetica, sans-serif" font-size="9" fill="#9b5cff" text-anchor="middle">HEALTH</text><text x="521" y="198" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="bold" fill="#effcff" text-anchor="middle">05</text><path d="M470 220H572M470 304H572" stroke="#40687c"/><text x="521" y="250" font-family="Arial, Helvetica, sans-serif" font-size="9" fill="#22d8ff" text-anchor="middle">ATTACK</text><text x="521" y="282" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="bold" fill="#effcff" text-anchor="middle">03</text><text x="521" y="334" font-family="Arial, Helvetica, sans-serif" font-size="9" fill="#22d8ff" text-anchor="middle">DEFENSE</text><text x="521" y="366" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="bold" fill="#effcff" text-anchor="middle">04</text></g>
<g id="abilities"><path d="M38 458H592V820H38Z" fill="#04101a" stroke="#22d8ff" stroke-width="3"/><text x="64" y="495" font-family="Arial, Helvetica, sans-serif" font-size="10" letter-spacing="3" fill="#22d8ff">FACTION / PILOT</text><path d="M64 520H566" stroke="#40687c"/><text x="64" y="558" font-family="Arial, Helvetica, sans-serif" font-size="10" letter-spacing="3" fill="#9b5cff">ACTIVE ABILITY</text><text x="64" y="590" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#effcff">ABILITY NAME</text><text x="64" y="616" font-family="Arial, Helvetica, sans-serif" font-size="9" fill="#7895aa">Effect, cost, target and duration.</text><path d="M64 650H566" stroke="#40687c"/><text x="64" y="685" font-family="Arial, Helvetica, sans-serif" font-size="10" letter-spacing="3" fill="#9b5cff">PASSIVE ABILITY</text><text x="64" y="717" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#effcff">SECONDARY EFFECT</text><text x="64" y="743" font-family="Arial, Helvetica, sans-serif" font-size="9" fill="#7895aa">Additional passive rule text.</text></g>
</svg>