<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="63mm" height="88mm" viewBox="0 0 630 880">
<title>06 Legendary Boss</title><defs>
<linearGradient id="bg" x2="1" y2="1"><stop stop-color="#090202"/><stop offset=".6" stop-color="#210606"/><stop offset="1" stop-color="#090202"/></linearGradient>
<linearGradient id="edge" x2="1" y2="1"><stop stop-color="#73352c"/><stop offset=".5" stop-color="#ff3e22"/><stop offset="1" stop-color="#ffb52e"/></linearGradient>
<pattern id="grid" width="18" height="18" patternUnits="userSpaceOnUse"><path d="M18 0H0V18" fill="none" stroke="#73352c" stroke-width=".5" opacity=".2"/></pattern>
<pattern id="dots" width="14" height="14" patternUnits="userSpaceOnUse"><circle cx="3" cy="3" r="1" fill="#ff3e22" opacity=".28"/></pattern>
</defs>
<rect x="8" y="8" width="614" height="864" rx="22" fill="url(#bg)" stroke="#fff4ec" stroke-width="4"/>
<rect x="22" y="22" width="586" height="836" rx="15" fill="url(#grid)"/>

<g id="header"><path d="M28 30H602V105H28Z" fill="#180505" stroke="#ff3e22" stroke-width="3"/><circle cx="68" cy="67" r="31" fill="#2b0906" stroke="#ffb52e" stroke-width="4"/><text x="68" y="78" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="bold" fill="#fff4ec" text-anchor="middle">8</text><text x="112" y="65" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="bold" fill="#fff4ec">CARD NAME</text><text x="112" y="88" font-family="Arial, Helvetica, sans-serif" font-size="9" letter-spacing="3" fill="#ff3e22">LEGENDARY • BOSS</text></g>
<g id="boss_art"><path d="M38 126H592V495L570 518H60L38 495Z" fill="#050101" stroke="url(#edge)" stroke-width="5"/><rect x="52" y="140" width="526" height="337" fill="url(#dots)"/><text x="315" y="318" font-family="Arial, Helvetica, sans-serif" font-size="19" letter-spacing="6" fill="#73352c" text-anchor="middle">BOSS ARTWORK</text></g>
<g id="boss_rules"><path d="M38 510H592V565H38Z" fill="#240806" stroke="#ffb52e" stroke-width="2"/><text x="62" y="545" font-family="Arial, Helvetica, sans-serif" font-size="10" letter-spacing="3" fill="#ffb52e">BOSS / VOID</text><path d="M38 585H592V790H38Z" fill="#160404" stroke="#ff3e22" stroke-width="3"/><text x="64" y="623" font-family="Arial, Helvetica, sans-serif" font-size="10" letter-spacing="3" fill="#ff3e22">BOSS ABILITY</text><text x="64" y="660" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#fff4ec">PHASE I — ABILITY</text><text x="64" y="687" font-family="Arial, Helvetica, sans-serif" font-size="9" fill="#ad6c61">Trigger, damage, special rule or condition.</text><path d="M64 712H566" stroke="#73352c"/><text x="64" y="748" font-family="Arial, Helvetica, sans-serif" font-size="10" letter-spacing="3" fill="#ffb52e">PHASE II</text><text x="64" y="775" font-family="Arial, Helvetica, sans-serif" font-size="9" fill="#ad6c61">Enrage, transform, summon, or final phase.</text><rect x="430" y="808" width="72" height="38" rx="8" fill="#2b0906" stroke="#ff3e22"/><text x="466" y="834" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#fff4ec" text-anchor="middle">10</text><rect x="515" y="808" width="72" height="38" rx="8" fill="#2b0906" stroke="#ffb52e"/><text x="551" y="834" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#fff4ec" text-anchor="middle">12</text></g>
