<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 750 1050" width="100%" height="100%">
  <defs>
    <radialGradient id="spaceBg" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#0b1b3a" />
      <stop offset="60%" stop-color="#040817" />
      <stop offset="100%" stop-color="#010206" />
    </radialGradient>
    <filter id="neonBlueGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="neonPurpleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <linearGradient id="frameBorderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b83eff" />
      <stop offset="30%" stop-color="#00d2ff" />
      <stop offset="70%" stop-color="#0055ff" />
      <stop offset="100%" stop-color="#9a1fe6" />
    </linearGradient>
    <linearGradient id="panelFillGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0c1a30" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#050a18" stop-opacity="0.95" />
    </linearGradient>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00183b" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#0b3166" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#00183b" stop-opacity="0.9" />
    </linearGradient>
    <pattern id="hexGrid" width="16" height="16" patternUnits="userSpaceOnUse">
      <path d="M8 0 L16 4 L16 12 L8 16 L0 12 L0 4 Z" fill="none" stroke="#00d2ff" stroke-width="0.5" stroke-opacity="0.15"/>
    </pattern>
  </defs>
  <style>
    .text-title { font-family: 'Segoe UI', -apple-system, sans-serif; font-weight: 800; fill: #ffffff; letter-spacing: 4px; text-anchor: middle; font-size: 26px; }
    .text-label { font-family: 'Segoe UI', -apple-system, sans-serif; font-weight: 600; fill: #8cc7ff; letter-spacing: 3px; font-size: 16px; }
    .text-placeholder { font-family: 'Segoe UI', -apple-system, sans-serif; font-weight: 700; fill: #4fa3ff; fill-opacity: 0.5; letter-spacing: 5px; text-anchor: middle; font-size: 18px; }
    .stat-number { font-family: 'Impact', 'Arial Black', sans-serif; fill: #ffffff; font-size: 48px; text-anchor: middle; }
  </style>
  <rect x="0" y="0" width="750" height="1050" rx="42" fill="url(#spaceBg)" stroke="#1a0b36" stroke-width="6"/>
