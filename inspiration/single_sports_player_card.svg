<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1536" viewBox="0 0 1024 1536">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#06143b"/><stop offset=".5" stop-color="#092b72"/><stop offset="1" stop-color="#04112f"/></linearGradient>
  <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0ee8ff"/><stop offset=".5" stop-color="#09a9ff"/><stop offset="1" stop-color="#0871ff"/></linearGradient>
  <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0751e9"/><stop offset="1" stop-color="#06257e"/></linearGradient>
  <pattern id="checker" width="28" height="28" patternUnits="userSpaceOnUse">
    <rect width="28" height="28" fill="#f8f8f8"/>
    <rect width="14" height="14" fill="#dedede"/>
    <rect x="14" y="14" width="14" height="14" fill="#dedede"/>
  </pattern>
  <filter id="shadow"><feDropShadow dx="0" dy="14" stdDeviation="12" flood-opacity=".55"/></filter>
  <filter id="glow"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>

<!-- Card -->
<rect x="18" y="18" width="988" height="1500" rx="8" fill="url(#bg)" stroke="#07122f" stroke-width="12"/>
<path d="M35 35H989V1500H35Z" fill="none" stroke="#0a4aa8" stroke-width="3"/>

<!-- Decorative side layers -->
<path d="M48 285L82 248V1100L48 1135Z" fill="#082d78"/>
<path d="M61 300L93 265V1070L61 1105Z" fill="url(#cyan)" opacity=".9"/>
<path d="M976 430L1000 455V980L976 1005Z" fill="#0b5fe0"/>
<path d="M950 460L976 485V950L950 975Z" fill="#0644bd"/>

<!-- Top tagline panel -->
