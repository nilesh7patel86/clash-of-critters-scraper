  <path d="M92 96L122 80H196L228 97V174L201 210L159 234L119 210L92 174Z" fill="#07183e" stroke="#fff" stroke-width="5"/>
  <circle cx="159" cy="121" r="30" fill="#fff"/>
  <path d="M143 111l16-12 17 12-6 20h-22zM133 126l10-9 6 21-12 9zM185 126l-10-9-6 21 12 9z" fill="#132c5b"/>
  <text x="159" y="158" text-anchor="middle" fill="#fff" font-family="Arial,sans-serif" font-size="24" font-weight="900">SPORTS</text>
  <text x="159" y="184" text-anchor="middle" fill="#fff" font-family="Arial,sans-serif" font-size="24" font-weight="900">CLUB</text>
  <text x="159" y="218" text-anchor="middle" fill="#fff" font-size="25">★</text>
</g>

<!-- Main photo frame -->
<path d="M82 278L128 231H848L930 311V1129L855 1202H128L82 1158Z" fill="#06194b" stroke="#0a5bdc" stroke-width="12"/>
<path d="M92 288L133 247H843L919 321V1120L848 1190H135L92 1149Z" fill="url(#cyan)" stroke="#08388f" stroke-width="6"/>
<path d="M105 301L142 264H834L905 329V1111L841 1177H145L105 1140Z" fill="#061d50" stroke="#092e7c" stroke-width="7"/>
<path d="M116 313L151 278H826L892 336V1103L833 1165H153L116 1133Z" fill="url(#checker)" stroke="#b5f6ff" stroke-width="5"/>

<!-- Right star column -->
<path d="M813 690L890 635V1104L838 1153H813Z" fill="#062a75" stroke="#0bbfff" stroke-width="6"/>
<g fill="#18dfff" filter="url(#glow)">
  <text x="851" y="733" text-anchor="middle" font-size="46">★</text>
  <text x="851" y="811" text-anchor="middle" font-size="46">★</text>
  <text x="851" y="889" text-anchor="middle" font-size="46">★</text>
  <text x="851" y="967" text-anchor="middle" font-size="46">★</text>
  <text x="851" y="1045" text-anchor="middle" font-size="46">★</text>
</g>
<path d="M841 1080l42-35v31l-42 35zM841 1122l42-35v31l-42 35zM841 1164l30-25v31l-30 25z" fill="#10dfff"/>

<!-- Bottom name section -->
<path d="M63 1214H268L308 1252H915L970 1305V1428H284L246 1392H63Z" fill="#061d55" stroke="#0b58d8" stroke-width="8"/>
<path d="M74 1228H260L296 1264H906L953 1309V1412H288L251 1377H74Z" fill="url(#blue)" stroke="#08d8ff" stroke-width="5"/>

<!-- Number plate -->
