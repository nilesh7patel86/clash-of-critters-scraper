<path d="M80 1230H255L299 1277V1380L259 1418H80Z" fill="url(#cyan)" stroke="#0a65d7" stroke-width="5"/>
<path d="M98 1248H247L279 1283V1365L245 1399H98Z" fill="#fff" opacity=".96"/>
<text x="188" y="1360" text-anchor="middle" fill="#09204d" font-family="Arial,sans-serif" font-size="108" font-weight="900">22</text>

<!-- Name plates -->
<path d="M310 1260H900L943 1300V1365H310Z" fill="#0750d7" stroke="#08cfff" stroke-width="4"/>
<path d="M310 1370H925L943 1387V1410H310Z" fill="#061b4d"/>
<text x="615" y="1325" text-anchor="middle" fill="#fff" font-family="Arial,sans-serif" font-size="51" font-weight="900" font-style="italic" letter-spacing="1">PLAYER NAME</text>
<text x="625" y="1401" text-anchor="middle" fill="#b9f8ff" font-family="Arial,sans-serif" font-size="25" font-weight="700" font-style="italic" letter-spacing="5">YOUR TEAM NAME</text>

<!-- Bottom angular accents -->
<path d="M45 1460H278L308 1489H45Z" fill="#0648ba"/>
<path d="M728 1462H970L924 1510H700Z" fill="#0ee1ff"/>
<path d="M760 1434H1000V1470H728Z" fill="#073ca5"/>

<!-- editable guidance -->
<text x="512" y="1525" text-anchor="middle" fill="#6ddff0" font-family="Arial,sans-serif" font-size="10" opacity=".5">EDITABLE VECTOR TEMPLATE</text>
</svg>