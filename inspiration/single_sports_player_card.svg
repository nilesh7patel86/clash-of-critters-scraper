<text x="636" y="139" text-anchor="middle" fill="#fff" font-family="Arial,sans-serif" font-size="43" font-weight="900" font-style="italic" letter-spacing="2">#YOUR TAGLINE</text>

<!-- Logo shield -->
<g filter="url(#shadow)">
  <path d="M68 78L115 54H203L252 78V184L209 236L159 266L109 236L68 184Z" fill="#fff" stroke="#06255f" stroke-width="12"/>
